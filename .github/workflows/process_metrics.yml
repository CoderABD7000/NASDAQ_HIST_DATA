name: Generate NAS100 Enriched Metrics Dataset (POCs + ADX/DI)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calculate-metrics:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy

    - name: Run Enriched Metrics Engine
      run: |
        python build_metrics.py

    - name: Commit and Push Processed Files
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add NAS100_2019_2026_*_Enriched_Metrics.csv
        git commit -m "Add multi-tf (5m, 15m, 30m, 1h) datasets with POCs and ADX/DI" || exit 0
        git push
