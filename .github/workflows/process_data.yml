name: Resample NASDAQ Intraday Data

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-and-resample:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas

    - name: Run Resampling Script
      run: |
        python -c "
        import glob
        import os
        import zipfile
        import pandas as pd

        OUTPUT_DIR = '.'
        UNZIP_DIR = './unzipped'
        COL_NAMES = ['date', 'time', 'open', 'high', 'low', 'close']

        os.makedirs(UNZIP_DIR, exist_ok=True)

        # 1. Unzip all zip files in repo
        zip_files = glob.glob('*.zip')
        print(f'Found {len(zip_files)} zip files.')
        
        for zf in zip_files:
            with zipfile.ZipFile(zf, 'r') as zip_ref:
                zip_ref.extractall(UNZIP_DIR)

        # 2. Extract and combine
        all_files = glob.glob(os.path.join(UNZIP_DIR, '**/*.csv'), recursive=True)
        if not all_files:
            all_files = glob.glob(os.path.join(UNZIP_DIR, '**/*.txt'), recursive=True)

        df_list = []
        for file_path in sorted(all_files):
            with open(file_path, 'r') as f:
                first_line = f.readline()
                sep = ';' if ';' in first_line else ','
            try:
                temp_df = pd.read_csv(file_path, sep=sep, header=None)
                if isinstance(temp_df.iloc[0, 2], str):
                    temp_df = pd.read_csv(file_path, sep=sep, header=0)
                temp_df = temp_df.iloc[:, :6]
                temp_df.columns = COL_NAMES
                df_list.append(temp_df)
            except Exception as e:
                print(f'Skipping {file_path}: {e}')

        master_1m = pd.concat(df_list, ignore_index=True)
        master_1m['datetime_str'] = master_1m['date'].astype(str) + ' ' + master_1m['time'].astype(str)
        master_1m['datetime'] = pd.to_datetime(master_1m['datetime_str'], errors='coerce')
        master_1m.dropna(subset=['datetime'], inplace=True)
        master_1m.drop_duplicates(subset=['datetime'], inplace=True)
        master_1m.sort_values(by='datetime', inplace=True)
        master_1m.set_index('datetime', inplace=True)

        # Helper to export resampled datasets
        def export_resampled(df, freq_str, filename):
            resampled = df.resample(freq_str).agg({
                'open': 'first',
                'high': 'max',
                'low': 'min',
                'close': 'last'
            }).dropna()
            resampled['date'] = resampled.index.strftime('%Y.%m.%d')
            resampled['time'] = resampled.index.strftime('%H:%M')
            resampled[COL_NAMES].to_csv(filename, index=False)
            print(f'Saved {filename} ({len(resampled):,} rows)')

        # Export all timeframes
        export_resampled(master_1m, '1min', 'NAS100_2019_2026_1m.csv')
        export_resampled(master_1m, '5min', 'NAS100_2019_2026_5m.csv')
        export_resampled(master_1m, '15min', 'NAS100_2019_2026_15m.csv')
        export_resampled(master_1m, '30min', 'NAS100_2019_2026_30m.csv')
        export_resampled(master_1m, '1h', 'NAS100_2019_2026_1h.csv')
        export_resampled(master_1m, '4h', 'NAS100_2019_2026_4h.csv')
        "

    - name: Commit and Push Processed Files to Repo
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-generate resampled NAS100 1m, 5m, 15m, 30m, 1h, 4h CSV files"
        file_pattern: "*.csv"
